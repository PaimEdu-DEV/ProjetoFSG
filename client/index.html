<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/mark-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta
      name="description"
      content="DevCore — aprenda a programar de verdade: exercícios práticos em Python, JavaScript e C#, e duelos de código ao vivo no Modo 1x1."
    />
    <title>DevCore — aprenda programando de verdade</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        transition: opacity 0.35s ease;
      }
      #app-splash img {
        width: 56px;
        height: 56px;
        animation: app-splash-pulse 1.1s ease-in-out infinite;
      }
      @keyframes app-splash-pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <img src="/mark-192.png" alt="" width="56" height="56" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        requestAnimationFrame(() => {
          const splash = document.getElementById("app-splash");
          if (!splash) return;
          setTimeout(() => {
            splash.style.opacity = "0";
            setTimeout(() => splash.remove(), 400);
          }, 150);
        });
      });
    </script>
  </body>
</html>
